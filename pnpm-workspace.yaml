allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Pins transitive deps to versions that clear `pnpm audit` advisories (KOI-148, KOI-359).
# `pkg@N` keys scope an override to the vulnerable major, leaving newer majors alone.
overrides:
  '@babel/core': ^7.29.1
  '@humanfs/node': ^0.16.8
  brace-expansion@1: ^1.1.21
  flatted: ^3.4.4
  minimatch@3: ^3.1.5
  picomatch@2: ^2.3.2
  baseline-browser-mapping: ^2.11.0
  browserslist: ^4.28.7
  postcss: ^8.5.10
  source-map-js: ^1.2.2
  ws: ^8.21.0
